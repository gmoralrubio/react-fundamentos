<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>React sample</title>
  <style>
    body {
      font-family: sans-serif;
    }

    section {
      border: 1px solid #666;
      border-radius: .4rem;
      padding: 16px;
    }
  </style>
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>
  <!-- // Para poder usar jsx debemos transpilar con Babel -->
  <script type="text/babel">


    // Los componentes de react van en PascalCase
    const Section = () => {
      // Crea elementos con React
      return (
        <section>
          <h1>Esto es un section</h1>
        </section>
      )
    }

    const App = () => {
      // Pintamos el Section
      // Hay que devolver en un div
      return (
        <div>
          <Section />
          <Section />
          <Section />
        </div>
      )
    }

    const rootElement = document.querySelector('#root')

    ReactDOM.render(App(), root)

  </script>
</body>
</body>

</html>
